[install]
# Save reviewed dependency versions without ranges.
exact = true
# Wait seven days before resolving newly published package versions.
minimumReleaseAge = 604800

[run]
# Run Node-shebang tools (Vite, TypeScript, Electron's CLI) with Bun.
bun = true

[test]
# Exclude vendored code, security tooling, and disposable test snapshots.
root = "tests"
